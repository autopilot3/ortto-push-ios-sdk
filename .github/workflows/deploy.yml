name: Validate and publish CocoaPods

on:
  workflow_dispatch:
    inputs:
      git-tag:
        description: Existing SDK tag to validate or publish
        required: true
        type: string
      publish:
        description: Publish validated podspecs to CocoaPods trunk
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cocoapods:
    name: Validate and publish ${{ inputs.git-tag }}
    runs-on: macos-15
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
      SDK_TAG: ${{ inputs.git-tag }}
    steps:
      - name: Checkout the existing release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git-tag }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods 1.17.0
        run: gem install cocoapods -v 1.17.0 --no-document

      - name: Verify podspec versions and source tags
        run: |
          expected_version="${SDK_TAG#v}"
          for podspec in OrttoSDKCore.podspec OrttoPushMessaging.podspec OrttoPushMessagingFCM.podspec OrttoPushMessagingAPNS.podspec OrttoInAppNotifications.podspec; do
            version=$(ruby -r cocoapods -e 'puts Pod::Specification.from_file(ARGV.fetch(0)).version' "$podspec")
            source_tag=$(ruby -r cocoapods -e 'puts Pod::Specification.from_file(ARGV.fetch(0)).source[:tag]' "$podspec")
            test "$version" = "$expected_version"
            test "$source_tag" = "$SDK_TAG"
          done

      - name: Validate podspecs
        run: |
          for podspec in OrttoSDKCore.podspec OrttoPushMessaging.podspec OrttoPushMessagingFCM.podspec OrttoPushMessagingAPNS.podspec OrttoInAppNotifications.podspec; do
            pod lib lint "$podspec" \
              --allow-warnings \
              --include-podspecs='Ortto*.podspec'
          done

      - name: Publish OrttoSDKCore
        if: inputs.publish
        run: pod trunk push OrttoSDKCore.podspec --allow-warnings --synchronous

      - name: Publish OrttoPushMessaging
        if: inputs.publish
        run: pod trunk push OrttoPushMessaging.podspec --allow-warnings --synchronous

      - name: Publish OrttoPushMessagingFCM
        if: inputs.publish
        run: pod trunk push OrttoPushMessagingFCM.podspec --allow-warnings --synchronous

      - name: Publish OrttoPushMessagingAPNS
        if: inputs.publish
        run: pod trunk push OrttoPushMessagingAPNS.podspec --allow-warnings --synchronous

      - name: Publish OrttoInAppNotifications
        if: inputs.publish
        run: pod trunk push OrttoInAppNotifications.podspec --allow-warnings --synchronous
